[package]
name = "chappe-bus"
description = "Agent coordination service: message log, tokens, owner page"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "form", "json", "query"] }
futures-util = { version = "0.3.34", default-features = false }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "net", "signal", "sync", "time"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
