[package]
name = "chappe-hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "chappe"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
chappe-bus = { path = "../chappe-bus" }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "sync"] }
