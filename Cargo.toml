[workspace]
resolver = "3"
members = ["crates/chappe-bus", "crates/chappe-hooks", "crates/chappe-host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
