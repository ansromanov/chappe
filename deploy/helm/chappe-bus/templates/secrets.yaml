{{- if and (not .Values.tokens.existingSecret) .Values.tokens.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chappe-bus.tokensSecret" . }}
  labels:
    {{- include "chappe-bus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $token := .Values.tokens.values }}
  {{ $name | quote }}: {{ $token | quote }}
  {{- end }}
{{- end }}
{{- if and (not .Values.webhook.existingSecret) .Values.webhook.secret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chappe-bus.webhookSecret" . }}
  labels:
    {{- include "chappe-bus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.webhook.secretKey }}: {{ .Values.webhook.secret | quote }}
{{- end }}
