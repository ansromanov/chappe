{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chappe-bus.fullname" . }}
  labels:
    {{- include "chappe-bus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chappe-bus.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- range .Values.networkPolicy.from }}
    - from:
        - {{- toYaml . | nindent 10 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
{{- end }}
