name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust:
    name: fmt, clippy, tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  msrv:
    name: builds with the minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint
        run: helm lint deploy/helm/chappe-bus --strict
      - name: Render and validate against the Kubernetes schemas
        run: |
          set -euo pipefail
          chart=deploy/helm/chappe-bus
          {
            helm template t "$chart"
            echo '---'
            helm template t "$chart" -f deploy/helm/chappe-bus/ci/full-values.yaml
          } | docker run --rm -i ghcr.io/yannh/kubeconform:latest -strict -summary -

  docker:
    name: image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: chappe-bus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: scripts/smoke-image.sh chappe-bus:ci

  secrets:
    name: no secrets in the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --no-banner --redact

  # One check for branch protection to require.
  ok:
    name: CI passed
    if: always()
    needs: [rust, msrv, helm, docker, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
