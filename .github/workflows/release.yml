name: Release

# A release is a tag `vX.Y.Z` that matches the version in Cargo.toml (see RELEASING.md).
# It builds the binaries for Linux and macOS, publishes the container image and the
# Helm chart to ghcr.io, and creates the GitHub release with the binaries, the
# checksums and the notes made from the Conventional Commits.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    name: the tag matches the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: v
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for pkg in chappe-bus chappe-host chappe-hooks; do
            found="$(cargo metadata --no-deps --format-version 1 --locked \
              | jq -r --arg p "$pkg" '.packages[] | select(.name == $p) | .version')"
            if [ "$found" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME, but $pkg is at $found in Cargo.toml"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: full tests before publishing
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    name: build ${{ matrix.asset }}
    needs: [verify, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: chappe-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: chappe-linux-aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: chappe-macos-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: chappe-macos-x86_64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p chappe-hooks -p chappe-bus -p chappe-host
      - name: Package
        run: |
          set -euo pipefail
          dist="${{ matrix.asset }}"
          mkdir "$dist"
          for bin in chappe chappe-bus chappe-host; do
            cp "target/${{ matrix.target }}/release/$bin" "$dist/"
          done
          cp LICENSE-MIT LICENSE-APACHE README.md "$dist/"
          tar -czf "$dist.tar.gz" "$dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  image:
    name: container image (amd64, arm64)
    needs: [verify, build]
    runs-on: ubuntu-latest
    env:
      # The build record is a workflow artifact nobody needs here.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: chappe-linux-*
          path: dist
          merge-multiple: true
      - name: Binaries per platform
        run: |
          set -euo pipefail
          mkdir -p ctx/data ctx/bin/amd64 ctx/bin/arm64
          tar -xzf dist/chappe-linux-x86_64.tar.gz -C ctx/bin/amd64 --strip-components=1 chappe-linux-x86_64/chappe-bus
          tar -xzf dist/chappe-linux-aarch64.tar.gz -C ctx/bin/arm64 --strip-components=1 chappe-linux-aarch64/chappe-bus
          cp deploy/docker/Dockerfile.release ctx/Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/chappe-bus
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    name: Helm chart
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: Package and push
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          helm package deploy/helm/chappe-bus --version "$VERSION" --app-version "$VERSION"
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "chappe-bus-$VERSION.tgz" "oci://ghcr.io/$owner/charts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: helm-chart
          path: chappe-bus-*.tgz

  release:
    name: GitHub release
    needs: [verify, build, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Only the archives and the chart: other artifacts of the run (such as the
      # build record of the image) are not part of a release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: chappe-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: helm-chart
          path: assets
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        with:
          tool: git-cliff
      - name: Checksums and notes
        run: |
          set -euo pipefail
          cd assets
          sha256sum chappe-*.tar.gz chappe-bus-*.tgz > SHA256SUMS
          cd ..
          git-cliff --latest --strip header --output notes.md
          if [ ! -s notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}." > notes.md
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
